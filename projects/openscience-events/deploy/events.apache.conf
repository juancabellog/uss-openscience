# Solo para el VirtualHost / location de OPENSCIENCE Events.
# No aplicar a /openscience ni a /openscience-api.

Alias /events /var/www/openscience-events
<Directory /var/www/openscience-events>
    Options FollowSymLinks
    AllowOverride FileInfo
    Require all granted
    FallbackResource /events/index.html
</Directory>
