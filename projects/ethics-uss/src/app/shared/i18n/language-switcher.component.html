<div class="lang" [class.lang--open]="open()">
  <button
    #trigger
    type="button"
    class="lang__trigger"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="menuId"
    [attr.aria-label]="('common.language' | translate) + ': ' + currentNativeName()"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="eth-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2c.7 1.3 1.3 3.3 1.5 5.5H10.5C10.7 8.3 11.3 6.3 12 5zm-4.2.8C6.6 7 5.8 8.6 5.4 10.5h3.2C8.8 8.6 8.3 6.9 7.8 5.8zM5.4 13.5c.4 1.9 1.2 3.5 2.4 4.7.5-1.1 1-2.8 1.2-4.7H5.4zm5.1 0h3c-.2 2.2-.8 4.2-1.5 5.5-.7-1.3-1.3-3.3-1.5-5.5zm4.7 0h3.2c-.4 1.9-1.2 3.5-2.4 4.7-.5-1.1-1-2.8-1.2-4.7h.4zm3.2-3H16.2c-.2-1.9-.7-3.6-1.2-4.7 1.2 1.2 2 2.8 2.4 4.7z" />
      </svg>
    </span>
    <span class="lang__label">{{ currentNativeName() }}</span>
    <span class="eth-icon lang__chevron" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <path d="M7.4 9.4 12 14l4.6-4.6 1.4 1.4L12 16.8 6 10.8z" />
      </svg>
    </span>
  </button>

  @if (open()) {
    <ul
      class="lang__menu"
      role="listbox"
      [id]="menuId"
      [attr.aria-label]="'common.language' | translate"
      (keydown)="onMenuKeydown($event)"
    >
      @for (option of options; track option.id; let index = $index) {
        <li>
          <button
            type="button"
            role="option"
            class="lang__option"
            [class.is-active]="language() === option.id"
            [class.is-focused]="activeIndex() === index"
            [attr.aria-selected]="language() === option.id"
            [tabindex]="activeIndex() === index ? 0 : -1"
            (click)="select(option.id)"
            (mousemove)="activeIndex.set(index)"
          >
            {{ option.nativeName }}
          </button>
        </li>
      }
    </ul>
  }
</div>
