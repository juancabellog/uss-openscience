# permissions-V3.yml
# Fuente funcional: Matriz_funciones_roles_Etica_Proyectos_V4.xlsx (Majo/Andrea).
# COMMITTEE_MEMBER fue eliminado del modelo por definicion de Andrea.
# El nombre del rol no contiene logica especial; AuthorizationService resuelve
# capabilities + scope + assignment/domain relation + workflow state.
# Las secciones global/committee/project/process son agrupaciones funcionales;
# NO reemplazan el scopeType efectivo de la asignacion.
# REASSIGN_REVIEWER_ADVANCED_STAGE es un privilegio excepcional confirmado
# para reasignar un revisor cuando el expediente ya se encuentra en etapa avanzada;
# se concede solamente a COMMITTEE_PRESIDENT.
