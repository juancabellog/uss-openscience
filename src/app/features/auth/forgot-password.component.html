<os-institutional-header />
<main class="auth-page">
  <section class="auth-card">
    <h1>{{ 'auth.forgotTitle' | translate }}</h1>
    <p>{{ 'auth.forgotHelp' | translate }}</p>
    @if (sent()) {
      <p>{{ 'auth.forgotGeneric' | translate }}</p>
    } @else {
      <form (ngSubmit)="submit()">
        <label class="filter-field">
          <span>{{ 'auth.email' | translate }}</span>
          <input class="os-control" type="email" [formControl]="email" autocomplete="email" />
        </label>
        <button type="submit" class="page-action page-action--primary" [disabled]="busy()">
          {{ 'auth.sendLink' | translate }}
        </button>
      </form>
    }
    <a routerLink="/login">{{ 'auth.backToLogin' | translate }}</a>
  </section>
</main>
