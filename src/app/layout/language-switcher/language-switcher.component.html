<div class="lang" [class.lang--open]="open()">
  <button
    type="button"
    class="lang__trigger"
    (click)="toggle()"
    [attr.aria-label]="'language.selector' | translate"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
  >
    <os-icon name="globe" />
    <span class="lang__label">{{ currentNativeName() }}</span>
    <os-icon name="chevron" />
  </button>

  @if (open()) {
    <ul
      class="lang__menu"
      role="listbox"
      [attr.aria-label]="'language.selector' | translate"
    >
      @for (option of options; track option.code) {
        <li>
          <button
            type="button"
            role="option"
            class="lang__option"
            [class.is-active]="i18n.currentLanguage() === option.code"
            [attr.aria-selected]="i18n.currentLanguage() === option.code"
            (click)="select(option.code)"
          >
            {{ option.nativeName }}
          </button>
        </li>
      }
    </ul>
  }
</div>
